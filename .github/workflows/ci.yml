name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile native helper
        run: |
          clang -fobjc-arc -fsyntax-only -Wall -mmacosx-version-min=14.0 \
            subocr/native/ocr_frames.m
